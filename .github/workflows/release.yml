name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify tag and package version
        run: |
          tag_version=${GITHUB_REF_NAME#v}
          package_version=$(node -p "require('./package.json').version")
          lock_version=$(node -p "require('./package-lock.json').version")
          compose_version=$(sed -n 's/.*WEBVOUCH_SLACK_IMAGE_TAG:-\([^}]*\).*/\1/p' docker-compose.ghcr.yml)
          example_version=$(sed -n 's/^WEBVOUCH_SLACK_IMAGE_TAG=//p' .env.example)
          test "$tag_version" = "$package_version"
          test "$tag_version" = "$lock_version"
          test "$tag_version" = "$compose_version"
          test "$tag_version" = "$example_version"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  github-release:
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create checksums
        run: shasum -a 256 slack-app-manifest.yaml docker-compose.yml docker-compose.ghcr.yml .env.example > SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" \
            slack-app-manifest.yaml \
            docker-compose.yml \
            docker-compose.ghcr.yml \
            .env.example \
            SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "WebVouch Slack Review Bridge $version"
